<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Project | Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div class="project-container">
        <aside class="sidebar-container">
            <div class="logo">
                <svg class="company-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M13,3V9H21V3M13,21H21V11H13M3,21H11V15H3M3,13H11V3H3V13Z" /></svg>
                <p>Dashboard</p>
            </div>
            <div class="nav">
                <ul>
                    <li>
                        <p>Home</p>
                    </li>
                    <li>
                        <p>Profile</p>
                    </li>
                    <li>
                        <p>Messages</p>
                    </li>
                    <li>
                        <p>History</p>
                    </li>
                    <li>
                        <p>Tasks</p>
                    </li>
                    <li>
                        <p>Communities</p>
                    </li>
                </ul>
            </div>
            <div class="settings">
                <ul>
                    <li>
                        <p>Settings</p>
                    </li>
                    <li>
                        <p>Support</p>
                    </li>
                    <li>
                        <p>Privacy</p>
                    </li>
                </ul>
            </div>
        </aside>
        <header class="header-container">
            <div class="search"></div>
            <div class="account"></div>
            <div class="user"></div>
            <div class="account-btns"></div>
        </header>
        <main class="main-container">
            <div class="projects">
                <div class="project-card">1</div>
                <div class="project-card">2</div>
                <div class="project-card">3</div>
                <div class="project-card">4</div>
                <div class="project-card">5</div>
                <div class="project-card">6</div>
            </div>
            <div class="announcements"></div>
            <div class="trending"></div>
        </main>
    </div>
</body>
</html>
